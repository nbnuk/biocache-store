sudo: required
language: java
jdk:
- openjdk8
branches:
  only:
  - master
  - develop
  - master-nbn

cache:
  directories:
    - $HOME/.m2

before_install:
- mkdir -p $HOME/.m2; wget -q -O $HOME/.m2/settings.xml https://raw.githubusercontent.com/nbnuk/travis-build-configuration/master/travis_maven_settings.xml
#- sudo mkdir -p /data/lucene; sudo wget -O /data/lucene/namematching.tgz https://archives.ala.org.au/archives/nameindexes/20200214/namematching-20200214.tgz
#- cd /data/lucene
#- sudo tar zxvf namematching.tgz
#- sudo ln -s /data/lucene/namematching-20200214 namematching
#- ls -laF
- cd $TRAVIS_BUILD_DIR

script: "[ \"${TRAVIS_PULL_REQUEST}\" = \"false\" ] && mvn deploy -Ptravis -Dmaven.test.skip=true || mvn install -Dmaven.test.skip=true -Ptravis"
env:
  global:
    - secure: 
    - secure: 
